apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: cafe-lumiere
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
  - secretKey: DATABASE_URL
    remoteRef:
      key: cafe/prod/app
      property: DATABASE_URL
  - secretKey: JWT_SECRET
    remoteRef:
      key: cafe/prod/app
      property: JWT_SECRET
