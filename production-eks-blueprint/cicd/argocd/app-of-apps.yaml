apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cafe-lumiere-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saiveerateja2000/Cafe-Lumiere.git
    targetRevision: main
    path: production-eks-blueprint/kubernetes/environments/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: cafe-lumiere
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
