name: ci-cd

on:
  push:
    branches: [main, develop, release/*]
  pull_request:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Unit tests
      run: |
        echo "Run frontend/backend tests here"
    - name: SCA/SAST scan
      run: |
        echo "Run trivy/grype/bandit/semgrep"

  build-and-push:
    needs: build-test-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [frontend, user-service, order-service, health-service]
    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::123456789012:role/github-actions-ecr-push
        aws-region: ${{ env.AWS_REGION }}
    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v2
    - name: Build and push
      run: |
        IMAGE_TAG=${GITHUB_SHA}
        echo "Build/push ${{ matrix.service }}:$IMAGE_TAG"

  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - name: Update manifests
      run: |
        echo "Patch dev image tags and create PR to GitOps repo"

  promote-staging-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Manual approval gates and progressive promotion
      run: |
        echo "Promote dev -> staging -> prod"
        echo "Rollback by reverting GitOps commit"
